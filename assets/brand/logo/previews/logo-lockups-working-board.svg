<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Working logo lockups — Modular Hub Europe</title>
  <desc id="desc">Four arrangements of the Clearance Gate symbol with the working name.</desc>
  <rect width="1600" height="1000" fill="#10263D"/>
  <text x="56" y="52" fill="#F4F1EA" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" letter-spacing="2">WORKING LOGO LOCKUPS / 04.08.2026</text>

  <!-- 01 horizontal single line -->
  <g transform="translate(40 80)">
    <rect width="980" height="260" fill="#F4F1EA"/>
    <text x="24" y="32" fill="#566473" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.5">01 / PRIMARY HORIZONTAL</text>
    <g fill="#10263D" transform="translate(55 82) scale(1.15)">
      <path d="M8 26h36v12H22v20h22v12H8V26Z"/><path d="M52 26h36v44H52V58h22V38H52V26Z"/><path d="M46 8h4v24h-4zM46 38h4v8h-4zM46 50h4v8h-4zM46 64h4v24h-4z"/>
    </g>
    <rect x="188" y="102" width="5" height="64" fill="#175CD3"/>
    <text x="225" y="151" fill="#10263D" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="46" font-weight="600">MODULAR HUB EUROPE</text>
  </g>

  <!-- 02 horizontal two line -->
  <g transform="translate(1040 80)">
    <rect width="520" height="420" fill="#E9E5DC"/>
    <text x="24" y="32" fill="#566473" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.5">02 / TWO-LINE</text>
    <g fill="#10263D" transform="translate(45 132) scale(1.2)">
      <path d="M8 26h36v12H22v20h22v12H8V26Z"/><path d="M52 26h36v44H52V58h22V38H52V26Z"/><path d="M46 8h4v24h-4zM46 38h4v8h-4zM46 50h4v8h-4zM46 64h4v24h-4z"/>
    </g>
    <rect x="171" y="155" width="5" height="91" fill="#175CD3"/>
    <text x="205" y="194" fill="#10263D" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="42" font-weight="600">MODULAR HUB</text>
    <text x="207" y="238" fill="#566473" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="8">EUROPE</text>
  </g>

  <!-- 03 stacked centered -->
  <g transform="translate(40 360)">
    <rect width="480" height="560" fill="#F4F1EA"/>
    <text x="24" y="32" fill="#566473" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.5">03 / STACKED</text>
    <g fill="#10263D" transform="translate(180 96) scale(1.25)">
      <path d="M8 26h36v12H22v20h22v12H8V26Z"/><path d="M52 26h36v44H52V58h22V38H52V26Z"/><path d="M46 8h4v24h-4zM46 38h4v8h-4zM46 50h4v8h-4zM46 64h4v24h-4z"/>
    </g>
    <rect x="205" y="238" width="70" height="5" fill="#175CD3"/>
    <text x="240" y="310" text-anchor="middle" fill="#10263D" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="47" font-weight="600">MODULAR HUB</text>
    <text x="240" y="362" text-anchor="middle" fill="#566473" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="10">EUROPE</text>
    <line x1="64" y1="470" x2="416" y2="470" stroke="#C8C4BB"/>
    <text x="240" y="507" text-anchor="middle" fill="#566473" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.4">SQUARE / DOSSIER / STAND</text>
  </g>

  <!-- 04 compact rail -->
  <g transform="translate(540 520)">
    <rect width="480" height="400" fill="#E9E5DC"/>
    <text x="24" y="32" fill="#566473" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.5">04 / COMPACT RAIL</text>
    <g fill="#10263D" transform="translate(46 76)">
      <path d="M8 26h36v12H22v20h22v12H8V26Z"/><path d="M52 26h36v44H52V58h22V38H52V26Z"/><path d="M46 8h4v24h-4zM46 38h4v8h-4zM46 50h4v8h-4zM46 64h4v24h-4z"/>
    </g>
    <rect x="70" y="198" width="4" height="155" fill="#175CD3"/>
    <text x="104" y="240" fill="#10263D" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="42" font-weight="600">MODULAR</text>
    <text x="104" y="287" fill="#10263D" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="42" font-weight="600">HUB</text>
    <text x="106" y="328" fill="#566473" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="7">EUROPE</text>
  </g>

  <!-- reversed test -->
  <g transform="translate(1040 520)">
    <rect width="520" height="400" fill="#175CD3"/>
    <text x="24" y="32" fill="#FFFFFF" opacity="0.78" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1.5">REVERSED / MONO TEST</text>
    <g fill="#FFFFFF" transform="translate(196 78) scale(1.25)">
      <path d="M8 26h36v12H22v20h22v12H8V26Z"/><path d="M52 26h36v44H52V58h22V38H52V26Z"/><path d="M46 8h4v24h-4zM46 38h4v8h-4zM46 50h4v8h-4zM46 64h4v24h-4z"/>
    </g>
    <text x="260" y="270" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="40" font-weight="600">MODULAR HUB</text>
    <text x="260" y="313" text-anchor="middle" fill="#FFFFFF" opacity="0.82" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="8">EUROPE</text>
  </g>

  <text x="40" y="968" fill="#F4F1EA" opacity="0.72" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">WORKING TITLE ONLY — REPLACE WORDMARK AFTER NAMING AND TRADEMARK REVIEW</text>
</svg>
