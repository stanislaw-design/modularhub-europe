<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#020B14" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#175CD3"/>
      <stop offset="1" stop-color="#0F5FE7"/>
    </linearGradient>
    <style>
      .display { font-family: Montserrat, Arial, sans-serif; }
      .body { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; }
      .micro { font-size: 11px; letter-spacing: 0.8px; }
      .small { font-size: 14px; }
    </style>
    <clipPath id="heroClip"><rect x="40" y="164" width="824" height="500" rx="8"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#081A2D"/>
  <rect x="0" y="0" width="12" height="1000" fill="#175CD3"/>

  <!-- Header -->
  <text x="40" y="54" class="mono label" fill="#7FAAFF">MODULARHUB / BRAND SYSTEM 03</text>
  <text x="40" y="112" class="display" font-size="48" font-weight="700" fill="#F4F1EA">Engineered confidence.</text>
  <text x="1558" y="54" text-anchor="end" class="mono label" fill="#8798A8">11.08.2026 / WORKING IDENTITY</text>
  <text x="1558" y="112" text-anchor="end" class="body" font-size="17" fill="#B6C2CC">Architectural ambition. Documentary precision.</text>

  <!-- Main logo panel -->
  <rect x="40" y="164" width="824" height="500" rx="8" fill="#F4F1EA" filter="url(#shadow)"/>
  <image href="../logo/v3/display/logo-modularhub-display-v3.png" x="40" y="164" width="824" height="550" preserveAspectRatio="xMidYMid meet" clip-path="url(#heroClip)"/>
  <rect x="64" y="188" width="174" height="28" rx="2" fill="#10263D"/>
  <text x="78" y="207" class="mono" font-size="11" font-weight="600" letter-spacing="1.4" fill="#F4F1EA">DISPLAY MARK / V3</text>
  <text x="64" y="637" class="mono micro" fill="#344657">LARGE-SCALE BRAND EXPRESSION · HERO · EXHIBITION · COVER</text>

  <!-- Palette panel -->
  <rect x="880" y="164" width="680" height="238" rx="8" fill="#F4F1EA"/>
  <text x="910" y="200" class="display label" fill="#10263D">CORE PALETTE</text>
  <text x="910" y="225" class="body small" fill="#344657">Navy controls. Blue moves. Warm white explains.</text>
  <g transform="translate(910,248)">
    <rect width="116" height="86" rx="4" fill="#10263D"/>
    <rect x="128" width="116" height="86" rx="4" fill="#081A2D" stroke="#314558"/>
    <rect x="256" width="116" height="86" rx="4" fill="#175CD3"/>
    <rect x="384" width="116" height="86" rx="4" fill="#0F5FE7"/>
    <rect x="512" width="108" height="86" rx="4" fill="#D9E0E7"/>
    <text x="0" y="108" class="mono" font-size="10" fill="#10263D">#10263D</text>
    <text x="128" y="108" class="mono" font-size="10" fill="#10263D">#081A2D</text>
    <text x="256" y="108" class="mono" font-size="10" fill="#10263D">#175CD3</text>
    <text x="384" y="108" class="mono" font-size="10" fill="#10263D">#0F5FE7</text>
    <text x="512" y="108" class="mono" font-size="10" fill="#10263D">#D9E0E7</text>
  </g>

  <!-- Typography panel -->
  <rect x="880" y="418" width="680" height="246" rx="8" fill="#10263D" stroke="#294259"/>
  <text x="910" y="454" class="display label" fill="#7FAAFF">TYPE SYSTEM</text>
  <text x="910" y="514" class="display" font-size="41" font-weight="700" fill="#F4F1EA">Precise by design.</text>
  <text x="910" y="552" class="body" font-size="17" fill="#C9D2DA">Inter keeps complex decisions readable.</text>
  <line x1="910" y1="579" x2="1530" y2="579" stroke="#395066"/>
  <text x="910" y="614" class="mono" font-size="16" font-weight="500" fill="#F4F1EA">DE-BY / 248,400 EUR / 12.40 × 4.15 M</text>
  <text x="910" y="642" class="mono micro" fill="#7FAAFF">MONTSERRAT 700  ·  INTER 400–600  ·  IBM PLEX MONO 400–600</text>

  <!-- Idea panel -->
  <rect x="40" y="680" width="558" height="258" rx="8" fill="#10263D" stroke="#294259"/>
  <rect x="40" y="680" width="8" height="258" rx="4" fill="url(#edge)"/>
  <text x="76" y="720" class="display label" fill="#7FAAFF">MASTER PROPOSITION</text>
  <text x="76" y="778" class="display" font-size="32" font-weight="700" fill="#F4F1EA">One project.</text>
  <text x="76" y="818" class="display" font-size="32" font-weight="700" fill="#F4F1EA">Different rules.</text>
  <text x="76" y="858" class="display" font-size="32" font-weight="700" fill="#4C8CFF">One clear path.</text>
  <text x="76" y="904" class="body small" fill="#B6C2CC">Promise the method — not an outcome without conditions.</text>

  <!-- Dual logo architecture panel -->
  <rect x="614" y="680" width="414" height="258" rx="8" fill="#F4F1EA"/>
  <text x="642" y="720" class="display label" fill="#10263D">TWO LEVELS / ONE SYSTEM</text>
  <image href="../logo/v2/symbol/logo-symbol-v2.svg" x="648" y="748" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
  <text x="786" y="774" class="display" font-size="17" font-weight="700" fill="#10263D">V3 DISPLAY</text>
  <text x="786" y="798" class="body" font-size="13" fill="#344657">Hero, covers, stands</text>
  <line x1="786" y1="817" x2="990" y2="817" stroke="#D9E0E7"/>
  <text x="786" y="846" class="display" font-size="17" font-weight="700" fill="#10263D">V2 OPERATIONAL</text>
  <text x="786" y="870" class="body" font-size="13" fill="#344657">App, favicon, dossier, mono</text>
  <text x="642" y="911" class="mono micro" fill="#175CD3">3D BUILDS PRESENCE · FLAT BUILDS CLARITY</text>

  <!-- Product/status panel -->
  <rect x="1044" y="680" width="516" height="258" rx="8" fill="#F4F1EA"/>
  <text x="1072" y="720" class="display label" fill="#10263D">PRODUCT LANGUAGE</text>
  <text x="1072" y="750" class="body small" fill="#344657">Brand blue is action. Status colors are evidence.</text>
  <rect x="1072" y="780" width="132" height="42" rx="4" fill="#175CD3"/>
  <text x="1138" y="806" text-anchor="middle" class="body" font-size="13" font-weight="700" fill="#FFFFFF">CONTINUE</text>
  <rect x="1218" y="780" width="94" height="42" rx="4" fill="#E7F3EC"/>
  <circle cx="1236" cy="801" r="5" fill="#14804A"/>
  <text x="1251" y="806" class="body" font-size="12" font-weight="600" fill="#145B3A">APPROVED</text>
  <rect x="1324" y="780" width="104" height="42" rx="4" fill="#F7EEDD"/>
  <circle cx="1342" cy="801" r="5" fill="#B76E00"/>
  <text x="1357" y="806" class="body" font-size="12" font-weight="600" fill="#815000">CONDITION</text>
  <rect x="1440" y="780" width="92" height="42" rx="4" fill="#F8E7E7"/>
  <circle cx="1458" cy="801" r="5" fill="#C43D3D"/>
  <text x="1473" y="806" class="body" font-size="12" font-weight="600" fill="#922D2D">BLOCKED</text>
  <rect x="1072" y="844" width="460" height="62" rx="4" fill="#FFFFFF" stroke="#D9E0E7"/>
  <text x="1092" y="869" class="mono micro" fill="#344657">NEXT REQUIREMENT</text>
  <text x="1092" y="891" class="body" font-size="14" font-weight="600" fill="#10263D">Structural calculation · Snow zone 2</text>

  <!-- Footer -->
  <text x="40" y="976" class="mono micro" fill="#6F8292">MODULARHUB EUROPE · VISUAL SYSTEM V3 · NAME REMAINS WORKING</text>
  <text x="1560" y="976" text-anchor="end" class="mono micro" fill="#6F8292">WARM WHITE 55 / NAVY 25 / BLUE 15 / SUPPORT 05</text>
</svg>
