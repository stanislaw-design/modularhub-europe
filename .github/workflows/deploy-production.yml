name: Deploy production

on:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Uruchom też pełne e2e na stagingu (opcjonalne, nie blokuje wdrożenia)
        type: boolean
        default: false

jobs:
  # Test dymny stagingu (zamiast pełnego e2e, patrz spec 0019 Follow-up): staging musi
  # odpowiadać 200 na kluczowych adresach. Prod rusza dopiero po przejściu tego kroku.
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Sprawdź, że staging odpowiada
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          fail=0
          for path in /pl /pl/results /pl/project-request /pl/login /en; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors               -H "x-vercel-protection-bypass: ${BYPASS}" "${STAGING_URL}${path}" || echo 000)
            echo "${path} -> ${code}"
            if [ "${code}" != "200" ]; then fail=1; fi
          done
          exit ${fail}

  # Pełne e2e jest opcjonalne (ręczne uruchomienie z zaznaczonym full_e2e): część testów
  # zakłada lokalne środowisko (ciasteczko sesji dla localhost, dane przykładowe), więc
  # nie jest jeszcze bramką przed produkcją. Naprawa suity: spec 0019 Follow-up.
  e2e:
    if: ${{ inputs.full_e2e }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Sprawdź e2e na aktualnym stagingu
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Testy e2e zakładają dane w bazie stagingu (ta sama, której używa aplikacja
          # stagingu); strażnik assertDevOrStagingDatabase odrzuci każdą inną bazę.
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}
        run: npm run test:e2e

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm install --global vercel@latest

      - name: Migruj bazę produkcyjną
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate

      - name: Pobierz konfigurację środowiska produkcyjnego
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Zbuduj dla produkcji
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Wdróż na produkcję
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
